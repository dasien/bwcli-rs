[workspace]
resolver = "2"
members = [
    "crates/bw-cli",
    "crates/bw-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Bitwarden Inc."]
license = "GPL-3.0"
rust-version = "1.88.0"

[workspace.dependencies]
# CLI Framework
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Bitwarden SDK (path dependencies from ../sdk-internal/)
bitwarden-core = { path = "../sdk-internal/crates/bitwarden-core", version = "=3.0.0" }
bitwarden-crypto = { path = "../sdk-internal/crates/bitwarden-crypto", version = "=3.0.0" }
bitwarden-auth = { path = "../sdk-internal/crates/bitwarden-auth", version = "=3.0.0" }
bitwarden-vault = { path = "../sdk-internal/crates/bitwarden-vault", version = "=3.0.0" }
bitwarden-collections = { path = "../sdk-internal/crates/bitwarden-collections", version = "=3.0.0" }
bitwarden-api-api = { path = "../sdk-internal/crates/bitwarden-api-api", version = "=3.0.0" }
bitwarden-generators = { path = "../sdk-internal/crates/bitwarden-generators", version = "=3.0.0" }
bitwarden-exporters = { path = "../sdk-internal/crates/bitwarden-exporters", version = "=3.0.0" }
bitwarden-send = { path = "../sdk-internal/crates/bitwarden-send", version = "=3.0.0" }
bitwarden-state = { path = "../sdk-internal/crates/bitwarden-state", version = "=3.0.0" }
bitwarden-pm = { path = "../sdk-internal/crates/bitwarden-pm", version = "=3.0.0", features = ["cli"] }
bitwarden-unlock = { path = "../sdk-internal/crates/bitwarden-unlock", version = "=3.0.0", features = ["cli"] }
bitwarden-encoding = { path = "../sdk-internal/crates/bitwarden-encoding", version = "=3.0.0" }
bitwarden-error = { path = "../sdk-internal/crates/bitwarden-error", version = "=3.0.0" }

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Security
secrecy = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"

# Utilities
directories = "5.0"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# Interactive prompts
dialoguer = "0.11"
indicatif = "0.17"

# Storage dependencies
tempfile = "3.12"
fs2 = "0.4"

# API and networking
url = "2.5"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CSV processing
csv = "1.3"

[profile.dev]
# Keep backtraces useful but drop the bulk of the DWARF. Full debug info (the
# default `debug = 2`) is roughly a third of every artifact, and this workspace
# links the whole bitwarden-* dependency graph into ~12 separate binaries (the
# bin, two lib-test targets, and every integration test), so that cost is paid
# over and over. Set this back to 2 temporarily if you need a full debugger
# session with variable inspection.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are rarely stepped through, so they don't need debug info at all.
# This is where most of the savings are: the SDK graph plus rustls/reqwest/
# passkey dwarfs our own crates.
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
