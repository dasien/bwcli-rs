[package]
name = "bw-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Bitwarden SDK
bitwarden-core = { workspace = true, features = ["internal"] }
bitwarden-crypto.workspace = true
bitwarden-auth.workspace = true
bitwarden-vault.workspace = true
bitwarden-collections.workspace = true
bitwarden-api-api.workspace = true
bitwarden-generators.workspace = true
bitwarden-exporters.workspace = true
bitwarden-send.workspace = true
bitwarden-state.workspace = true
bitwarden-pm.workspace = true
bitwarden-unlock.workspace = true
bitwarden-encoding.workspace = true
bitwarden-error.workspace = true

# HTTP and API
reqwest.workspace = true
url.workspace = true
async-trait.workspace = true
directories.workspace = true

# Security
secrecy.workspace = true
zeroize.workspace = true
sha2.workspace = true

# Utilities
base64.workspace = true
rand.workspace = true
uuid.workspace = true
chrono.workspace = true
regex.workspace = true

# Storage
fs2.workspace = true

# CSV processing
csv.workspace = true
serde_urlencoded = "0.7.1"

[dev-dependencies]
# NOTE: deliberately no `tokio` entry here. Adding `features = ["test-util"]`
# (which is *not* part of tokio's `full`) changes tokio's feature set for the
# test build only, which changes its fingerprint, which forces a second
# compilation of every crate above it — bitwarden-core/-vault/-auth/-send,
# bw-core, and the `bw` binary. That roughly doubled target/. Nothing in the
# tests uses test-util (no time::pause / start_paused), and `#[tokio::test]`
# works fine from the regular dependency's `full` feature set.
tempfile.workspace = true
wiremock = "0.6"
